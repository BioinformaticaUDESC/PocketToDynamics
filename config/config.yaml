project:
  name: "PocketToDynamics"
  version: "0.1.0"

paths:
  root: "~/PocketToDynamics"
  receptors: "input/receptors"
  ligands: "input/ligands"
  metadata: "input/metadata"
  work: "work"
  results: "results"
  logs: "logs"
  manifest: "manifest"

workflow:
  overwrite: false
  resume: true
  strict_qc: true

# Executable module order is defined in scripts/p2d_steps.py (M01–M21).
# This project config does not disable individual orchestration steps.
